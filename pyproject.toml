[project]
name = "ts-classification"
version = "0.1.0"
description = "Time series classification in financial markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
bert = [
    "torch>=2.12.0",
    "transformers>=5.8.1",
]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ts-classification-run = "ts_classification.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ts_classification"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
